name: Build & Deploy Hexo Blog
on:
  push:
    branches: [ main ] # 源码分支
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库全部代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 切换到子目录 my-blog
      - name: Enter Hexo dir
        run: cd my-blog

      # 配置Node环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-blog/package-lock.json

      # 安装Hexo依赖
      - name: Install dependencies
        run: cd my-blog && npm install

      # 构建静态网页
      - name: Build static files
        run: cd my-blog && hexo clean && hexo generate

      # 上传构建产物
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-blog/public

  # 部署到GitHub Pages
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4